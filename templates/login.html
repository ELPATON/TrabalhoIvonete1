<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduFlow - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>
<body class="login-page">
    <div class="login-wrapper">
        <div class="login-brand">
            <div class="login-brand-content">
                <div class="logo-badge">
                    <div class="badge-icon">EF</div>
                    <span>EduFlow</span>
                </div>
                <h2>Plataforma<br>de Gestão Escolar</h2>
                <p>Gerencie alunos, professores, turmas e notas em um só lugar.</p>
                <div class="brand-features">
                    <div class="feature"><span class="check">✓</span> Controle acadêmico completo</div>
                    <div class="feature"><span class="check">✓</span> Acompanhamento de notas</div>
                    <div class="feature"><span class="check">✓</span> Gestão de turmas</div>
                </div>
            </div>
        </div>
        <div class="login-form-area">
            <h3>Bem-vindo</h3>
            <p class="login-sub">Faça login para continuar</p>

            {% if erro %}
            <div class="msg-erro">{{ erro }}</div>
            {% endif %}

            <form action="/login" method="POST">
                <div class="form__field">
                    <label>@</label>
                    <input type="email" name="email" placeholder="Seu email" required>
                </div>
                <div class="form__field">
                    <label>#</label>
                    <input type="password" name="senha" placeholder="Sua senha" required>
                </div>
                <input type="submit" value="ENTRAR">
            </form>

            <p class="small">
                Acesso restrito ao administrador
            </p>
        </div>
    </div>
</body>
</html>
