{% extends 'base.html' %}

{% block conteudo %}

<div style="max-width: 400px; margin: 3rem auto;">
    <div class="form-card">
        <h2>Criar conta</h2>

        {% if erro %}
        <p style="color: red; margin-bottom: 1rem;">{{ erro }}</p>
        {% endif %}

        {% if sucesso %}
        <p style="color: green; margin-bottom: 1rem;">{{ sucesso }}</p>
        {% endif %}

        <form action="/cadastro" method="POST">
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="senha" placeholder="Senha (mínimo 6 caracteres)" required>
            <select name="perfil">
                <option value="aluno">Aluno</option>
                <option value="professor">Professor</option>
                <option value="admin">Admin</option>
            </select>
            <button type="submit">Cadastrar</button>
        </form>

        <p style="margin-top: 1rem; font-size: 0.9rem;">
            Já tem conta? <a href="/login" style="color: #185FA5;">Faça login</a>
        </p>
    </div>
</div>

{% endblock %}
