{% extends 'base.html' %}

{% block conteudo %}

<div class="page-header">
    <h1>Notas</h1>
</div>

<div class="form-card">
    <h2>Nova nota</h2>
    <form action="/notas/novo" method="POST">
        <select name="aluno_id" required>
            <option value="">Selecione o aluno</option>
            {% for aluno in alunos %}
            <option value="{{ aluno.id }}">{{ aluno.nome }}</option>
            {% endfor %}
        </select>
        <input type="text" name="disciplina" placeholder="Disciplina" required>
        <select name="bimestre">
            <option value="1º bimestre">1º bimestre</option>
            <option value="2º bimestre">2º bimestre</option>
            <option value="3º bimestre">3º bimestre</option>
            <option value="4º bimestre">4º bimestre</option>
        </select>
        <input type="number" name="valor" placeholder="Nota (0-10)" min="0" max="10" step="0.1" required>
        <button type="submit">Salvar</button>
    </form>
</div>

<div class="table-card">
    <h2>Lista de notas</h2>
    <table>
        <thead>
            <tr>
                <th>Aluno</th>
                <th>Disciplina</th>
                <th>Bimestre</th>
                <th>Nota</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for nota in notas %}
            <tr>
                <td>{{ nota.aluno_id }}</td>
                <td>{{ nota.disciplina }}</td>
                <td>{{ nota.bimestre }}</td>
                <td>{{ nota.valor }}</td>
                <td>
                    <a href="/notas/excluir/{{ nota.id }}"
                       onclick="return confirm('Excluir esta nota?')">
                       Excluir
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% endblock %}
